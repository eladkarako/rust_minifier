[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "whitespace-based rust-code minification, with comment and rustdoc removing. parallel processing."
documentation = "https://github.com/eladkarako/rust_minifier#readme"
edition = "2024"
homepage = "https://github.com/eladkarako/rust_minifier"
keywords = ["minifier", "comment-remover", "rustdoc-remover", "parallel", "cli"]
license = "MIT"
name = "rust_minifier"
readme = "README.md"
repository = "https://github.com/eladkarako/rust_minifier"
rust-version = "1.93.0"
version = "26.10.2"

[[bin]]
name = "rust_minifier"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"                                         # Flexible error handling with context
chrono = "0.4.45"                                          # Date and time handling
clap = { version = "4.6.7", features = ["derive"] }        # Command-line argument parsing with derive macros
filetime = "0.2.29"                                        # Access and modify file metadata timestamps
is-terminal = "0.4.17"                                     # Detect if stdout/stderr is connected to a terminal
num_cpus = "1.17.0"                                        # Query the number of CPUs available
proc-macro2 = "1.0.107"                                    # Procedural macro utilities and token manipulation
quote = "1.0.47"                                           # Code generation for writing Rust tokens
syn = { version = "3.0.6", features = ["full"] }           # Parse Rust syntax trees with full feature support
tempfile = "3.27.0"                                        # Creating temporary files
thiserror = "2.0.21"                                       # Derive custom error types with minimal boilerplate
tokio = { version = "1.53.1", features = ["full"] }        # Async runtime with all features enabled

[dev-dependencies]
temp-dir = "0.2.0"                                         # Simple temporary directory with cleanup (Provides a TempDir struct).

[build-dependencies]
toml = "1.1.6"                                             # TOML parsing for build scripts
winres = "0.1.12"                                          # Windows resource file handling (exe metadata, icons, version info)

[profile.release]
codegen-units = 1                                          # Single unit for better optimization and binary size
debug = false                                              # Strip debug symbols for smaller binary
incremental = false                                        # Disable incremental compilation for cleaner builds
lto = true                                                 # Link-time optimization for better performance
opt-level = "z"                                            # Maximum optimization for binary size
panic = "abort"                                            # Replace unwinding with abort (smaller binary, faster panics)
rpath = false                                              # Don't embed runtime library search paths
strip = true                                               # Strip all symbols from final binary
