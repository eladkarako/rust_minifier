[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "whitespace-based rust-code minification, with comment and rustdoc removing. and TOML minification, parallel processing."
documentation = "https://github.com/eladkarako/rust_minifier#readme"
edition = "2024"
homepage = "https://github.com/eladkarako/rust_minifier"
keywords = ["minifier", "comment-remover", "rustdoc-remover", "parallel", "cli"]
license = "MIT"
name = "rust_minifier"
readme = "README.md"
repository = "https://github.com/eladkarako/rust_minifier"
rust-version = "1.93.0"
version = "26.10.19"

[[bin]]
name = "rust_minifier"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.104" }                          # Flexible error handling with context
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }   # Date and time handling
clap = { version = "4.6.7", features = ["derive", "wrap_help", "usage", "cargo", "suggestions", "help", "color"] }         # Command-line argument parsing with derive macros
filetime = { version = "0.2.29" }                          # Access and modify file metadata timestamps
is-terminal = { version = "0.4.17" }                       # Detect if stdout/stderr is connected to a terminal
num_cpus = { version = "1.17.0" }                          # Query the number of CPUs available
proc-macro2 = { version = "1.0.107" }                     # Procedural macro utilities and token manipulation
tempfile = { version = "3.27.0" }                          # Creating temporary files
tokio = { version = "1.53.1", features = ["full"] }        # Async runtime with all features enabled
alphanumeric-sort = { version = "1.5.8" }                   # sort correctly when entry has numbers

[dev-dependencies]
temp-dir = "0.2.0"                                          # Simple temporary directory with cleanup (Provides a TempDir struct).


# Optional: Memory allocation improvements
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
mimalloc = { version = "0.1.52" }

[target.x86_64-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[target.i686-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[target.aarch64-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[profile.release]
codegen-units = 1                                                   # Single unit for better optimization and smaller binary size
debug = false                                                       # Strip debug symbols for smaller binary
incremental = false                                                 # Disable incremental compilation for cleaner builds
lto = true                                                          # Link-time optimization for better performance
opt-level = 2                                                       # prioritizes speed (loop unrolling, better branch prediction, instruction cache fit) over binary size.
panic = "abort"                                                     # Replace unwinding with abort (smaller binary, faster panics)
rpath = false                                                       # Don't embed runtime library search paths
strip = true                                                        # Strip all symbols from final binary